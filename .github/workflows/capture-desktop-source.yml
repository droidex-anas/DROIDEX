name: Capture desktop source
on:
  push:
    branches: [feat/capture-studio-draft]
    paths: [.github/workflows/capture-desktop-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD > /tmp/capture-desktop-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capture-desktop-source
          path: /tmp/capture-desktop-source.tar.gz
          retention-days: 1
