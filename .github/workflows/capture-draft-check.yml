name: Capture draft checks
on:
  push:
    branches: [feat/capture-studio-draft]
    paths:
      - '.github/workflows/capture-draft-check.yml'
      - 'tools/apply-capture-draft.cjs'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        env:
          HUSKY: '0'
      - run: npm run typecheck
      - run: node --check electron/capture/service.cjs && node --check electron/capture/store.cjs && node --check electron/capture/native.cjs
