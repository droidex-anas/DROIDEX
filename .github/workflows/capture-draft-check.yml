name: Capture draft checks
on:
  push:
    branches: [feat/capture-studio-draft]
  pull_request:
    paths:
      - 'src/features/capture/**'
      - 'electron/capture/**'
      - 'src/components/PromptInput.tsx'
      - 'src/components/SettingsPanel.tsx'
      - 'src/hooks/useImageAttachments.ts'
      - 'tools/capture-*'
      - '.github/workflows/capture-draft-check.yml'
permissions:
  contents: read
concurrency:
  group: capture-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: install
        run: npm ci --ignore-scripts && npm ci --prefix sidecar --ignore-scripts
        env:
          HUSKY: '0'
      - name: Typecheck renderer and sidecar
        run: npm run typecheck && npm run sidecar:typecheck
      - name: Check Electron syntax and capture regression tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run electron:check && npm run test:capture
      - name: Lint capture and integration seams
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx eslint src/features/capture electron/capture src/hooks/useImageAttachments.ts src/components/composer/AddMenu.tsx
      - name: Production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Full renderer and Electron test suite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test
      - name: Formatting and file-size budgets
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx prettier --check src/features/capture electron/capture docs/capture.md && npm run quality:file-size
  mac-unit:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native executable and host unit tests
        run: test -x /usr/sbin/screencapture && node --test electron/capture/*.test.cjs
