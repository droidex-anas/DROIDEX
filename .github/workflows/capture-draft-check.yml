name: Capture draft checks

on:
  push:
    branches: [feat/capture-studio-draft]

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        env:
          HUSKY: '0'
      - run: npm ci --prefix sidecar --ignore-scripts
      - name: Package isolated validation dependencies
        run: tar -czf capture-toolchain.tar.gz node_modules sidecar/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: capture-toolchain
          path: capture-toolchain.tar.gz
          retention-days: 1
