name: Capture draft refinement
on:
  push:
    branches: [feat/capture-studio-draft]
    paths:
      - '.github/workflows/capture-draft-check.yml'
      - 'tools/finish-capture-draft.cjs'
permissions:
  contents: write
concurrency:
  group: capture-draft-refinement
  cancel-in-progress: false
jobs:
  refine:
    if: github.ref == 'refs/heads/feat/capture-studio-draft'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/capture-studio-draft
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        env:
          HUSKY: '0'
      - name: Apply scoped refinements
        run: node tools/finish-capture-draft.cjs
      - name: Verify source types
        run: npm run typecheck
      - name: Commit source changes to the feature branch only
        env:
          HUSKY: '0'
        run: |
          git diff --check
          git add src/features/capture electron/capture src/index.css tools/capture-ui-smoke.mjs tools/finish-capture-draft.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix(capture): harden async lifetimes and isolate styles from Node test imports'
          git push origin HEAD:refs/heads/feat/capture-studio-draft
      - name: Capture regression tests
        run: npm run test:capture
      - name: Remaining lint diagnostics
        if: ${{ !cancelled() }}
        run: |
          npx eslint src/features/capture electron/capture -f json > capture-lint.json || true
          node <<'NODE'
          const results = require('./capture-lint.json');
          for (const file of results) for (const message of file.messages) console.log(`${file.filePath}:${message.line}:${message.column} ${message.severity === 2 ? 'ERROR' : 'WARN'} ${message.ruleId}: ${message.message}`);
          process.exitCode = results.some(file => file.errorCount) ? 1 : 0;
          NODE
      - name: Previously failing renderer integration tests
        if: ${{ !cancelled() }}
        run: node --import tsx --test src/components/PromptInput.test.ts src/components/SettingsPanel.test.ts src/components/chat.test.ts
