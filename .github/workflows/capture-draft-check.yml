name: Capture packaging integration
on:
  push:
    branches: [feat/capture-studio-draft]
    paths:
      - '.github/workflows/capture-draft-check.yml'
      - 'tools/package-capture-draft.cjs'
permissions:
  contents: write
concurrency:
  group: capture-packaging-integration
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/feat/capture-studio-draft'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/capture-studio-draft
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts && npm ci --prefix sidecar --ignore-scripts
        env:
          HUSKY: '0'
      - run: node tools/package-capture-draft.cjs
      - run: npm run typecheck && npm run test:capture
      - name: Commit reviewed source changes to the feature branch only
        env:
          HUSKY: '0'
        run: |
          git diff --check
          git add src/features/capture electron/capture electron/preload.cjs src/index.css src/components/SettingsPanel.tsx docs/generated/project-reference.md tools/package-capture-draft.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'perf(capture): lazy-load editor styles and keep screenshot cards on existing tokens'
          git push origin HEAD:refs/heads/feat/capture-studio-draft
      - name: Repository quality gates
        run: npm run docs:check && npm run quality:deadcode && npm run quality:boundaries
      - name: Original bundle-size budgets
        if: ${{ !cancelled() }}
        run: |
          if npm run build > capture-build.log 2>&1; then
            npm run quality:bundle-budgets
          else
            tail -n 60 capture-build.log
            exit 1
          fi
      - name: Renderer import regression tests
        if: ${{ !cancelled() }}
        run: node --import tsx --test src/components/PromptInput.test.ts src/components/SettingsPanel.test.ts src/components/chat.test.ts
