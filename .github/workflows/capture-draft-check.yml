name: Capture draft checks

on:
  push:
    branches: [feat/capture-studio-draft]
  pull_request:
    paths:
      - 'src/features/capture/**'
      - 'electron/capture/**'
      - '.github/workflows/capture-draft-check.yml'

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive reproducible source snapshot
        run: git archive --format=tar.gz --output=capture-draft-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: capture-draft-source
          path: capture-draft-source.tar.gz
          retention-days: 1
