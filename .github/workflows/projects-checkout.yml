name: Projects checkout
on:
  push:
    branches: [feat/local-projects]
permissions:
  contents: read
jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix sidecar --ignore-scripts --no-audit --no-fund
      - run: tar -czf projects-deps.tar.gz node_modules sidecar/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: projects-deps
          path: projects-deps.tar.gz
          retention-days: 1
