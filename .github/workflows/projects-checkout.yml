name: Projects checkout
on:
  push:
    branches: [feat/local-projects]
permissions:
  contents: read
jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar --output=projects-source.tar HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: projects-source
          path: projects-source.tar
          retention-days: 1
