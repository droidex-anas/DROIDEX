name: Regression guard

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

concurrency:
  group: regression-guard-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  held-out-suite:
    name: Evaluate held-out regression approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # The workflow and helper come from the trusted default branch. PR code
      # is inspected through metadata only; never check it out or install it.
      - run: node tools/check-regression-approval.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
