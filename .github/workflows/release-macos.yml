name: Release macOS

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: true
  NODE_VERSION: '22'
  RELEASE_REPOSITORY: droidex-anas/droidex-releases
  DROIDEX_ALLOW_AD_HOC_RELEASE: ${{ vars.DROIDEX_ALLOW_AD_HOC_RELEASE }}
  DROIDEX_SIGNING_CERT_SHA256: ${{ vars.DROIDEX_SIGNING_CERT_SHA256 }}

jobs:
  release:
    name: Verify and publish macOS release
    runs-on: macos-15
    timeout-minutes: 60
    environment: macos-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sidecar/package-lock.json

      - name: Validate release identity
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
          test -f "docs/releases/$GITHUB_REF_NAME.md"
          git tag --points-at HEAD --list "$GITHUB_REF_NAME" | grep -Fx "$GITHUB_REF_NAME"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix sidecar
          npx playwright install chromium

      - name: Run release gates
        run: |
          npm run format:check
          npm run docs:check
          npm run typecheck
          npm run sidecar:typecheck
          npm run electron:check
          npm run test
          npm --prefix sidecar run test
          npm run quality:file-size
          npm run quality:tech-debt
          npm run quality:boundaries
          npm run quality:deps
          npm run quality:deadcode
          npm run quality:duplicates
          npm run security:audit-report

      - name: Import stable self-signed release certificate
        shell: bash
        env:
          DROIDEX_SIGNING_CERT_P12_BASE64: ${{ secrets.DROIDEX_SIGNING_CERT_P12_BASE64 }}
          DROIDEX_SIGNING_CERT_PASSWORD: ${{ secrets.DROIDEX_SIGNING_CERT_PASSWORD }}
        run: |
          if test -z "$DROIDEX_SIGNING_CERT_P12_BASE64" || test -z "$DROIDEX_SIGNING_CERT_PASSWORD"; then
            # An accidental secret deletion must not change the identity that owns macOS permissions.
            if test "$DROIDEX_ALLOW_AD_HOC_RELEASE" != 'true'; then
              echo "::error::Signing secrets are missing or incomplete. Restore both secrets or explicitly set DROIDEX_ALLOW_AD_HOC_RELEASE=true."
              echo "Release blocked: signing secrets are missing or incomplete; ad-hoc signing was not authorized." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "::warning::Explicitly opted into an ad-hoc release. macOS permissions may be requested again after updates."
            echo "Ad-hoc release explicitly authorized by DROIDEX_ALLOW_AD_HOC_RELEASE=true. macOS permissions may be requested again after updates." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ ! "$DROIDEX_SIGNING_CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Set repository variable DROIDEX_SIGNING_CERT_SHA256 to the existing certificate's lowercase SHA-256 fingerprint."
            exit 1
          fi
          umask 077
          CERTIFICATE_PATH="$RUNNER_TEMP/droidex-signing.p12"
          PUBLIC_CERTIFICATE_PATH="$RUNNER_TEMP/droidex-signing.pem"
          KEYCHAIN_PATH="$RUNNER_TEMP/droidex-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$DROIDEX_SIGNING_CERT_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          openssl pkcs12 -in "$CERTIFICATE_PATH" -clcerts -nokeys \
            -passin env:DROIDEX_SIGNING_CERT_PASSWORD |
            openssl x509 -out "$PUBLIC_CERTIFICATE_PATH"
          CERTIFICATE_SHA256="$(openssl x509 -in "$PUBLIC_CERTIFICATE_PATH" -outform DER | shasum -a 256 | awk '{print $1}')"
          if test "$CERTIFICATE_SHA256" != "$DROIDEX_SIGNING_CERT_SHA256"; then
            echo "::error::Signing certificate does not match DROIDEX_SIGNING_CERT_SHA256. Restore the pinned certificate; replacing it resets macOS permissions."
            exit 1
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$DROIDEX_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          # Trust only code signing on this disposable runner so identity discovery accepts it.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k "$KEYCHAIN_PATH" "$PUBLIC_CERTIFICATE_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F '"DROIDEX Self-Signed"'
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "DROIDEX_SELF_SIGNED_IDENTITY=DROIDEX Self-Signed" >> "$GITHUB_ENV"
          echo "Stable self-signed release using pinned certificate SHA-256: $CERTIFICATE_SHA256. Artifact verification also checks its designated requirement." >> "$GITHUB_STEP_SUMMARY"
          rm "$CERTIFICATE_PATH"

      - name: Build macOS artifacts
        env:
          DROIDEX_UNSIGNED_RELEASE_BUILD: '1'
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # RUM application id and client token are client-side credentials and
          # are embedded in the build. The Datadog API key is never used here.
          DATADOG_APPLICATION_ID: ${{ secrets.DATADOG_APPLICATION_ID }}
          DATADOG_CLIENT_TOKEN: ${{ secrets.DATADOG_CLIENT_TOKEN }}
          DATADOG_SITE: ${{ vars.DATADOG_SITE }}
          # Marks these artifacts as the real release channel. Builds made
          # anywhere else stay 'local' and are excluded from install counts.
          DROIDEX_DISTRIBUTION_CHANNEL: release
        run: npm run dist:mac

      # Sparkle builds binary deltas against the last few published ZIPs. Users on
      # those versions download only the changed bytes; anyone further behind (or
      # with a modified app bundle) falls back to the full ZIP.
      - name: Fetch previous releases for Sparkle deltas
        env:
          GH_TOKEN: ${{ secrets.DROIDEX_RELEASE_TOKEN }}
        run: |
          PREVIOUS_DIR="$RUNNER_TEMP/sparkle-previous"
          mkdir -p "$PREVIOUS_DIR"
          # Assigned first so a failed listing stops the job instead of looping over nothing.
          TAGS="$(gh release list --repo "$RELEASE_REPOSITORY" \
            --exclude-drafts --exclude-pre-releases --limit 3 \
            --json tagName --jq '.[].tagName')"
          for tag in $TAGS; do
            gh release download "$tag" --repo "$RELEASE_REPOSITORY" \
              --pattern 'droidex-arm64.zip' --pattern 'droidex-x64.zip' \
              --dir "$PREVIOUS_DIR/$tag" ||
              echo "::warning::No Sparkle delta base from $tag; its users get the full ZIP."
          done
          echo "SPARKLE_PREVIOUS_RELEASES_DIR=$PREVIOUS_DIR" >> "$GITHUB_ENV"

      - name: Sign Sparkle feeds and verify artifacts
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          npm run sparkle:appcast -- release
          npm run release:verify:mac -- release --write-checksums

      - name: Run unsigned release preflight
        env:
          GH_TOKEN: ${{ github.token }}
          DROIDEX_RELEASE_GH_TOKEN: ${{ secrets.DROIDEX_RELEASE_TOKEN }}
        run: npm run release:preflight:unsigned

      - name: Retain verified artifacts privately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: droidex-${{ github.ref_name }}-macos
          if-no-files-found: error
          path: |
            release/droidex-arm64.dmg
            release/droidex-arm64.zip
            release/droidex-x64.dmg
            release/droidex-x64.zip
            release/appcast-arm64.xml
            release/appcast-x64.xml
            release/*.delta
            release/SHA256SUMS

      - name: Publish immutable public GitHub release
        env:
          GH_TOKEN: ${{ secrets.DROIDEX_RELEASE_TOKEN }}
        run: |
          shopt -s nullglob
          ASSETS=(
            release/droidex-arm64.dmg
            release/droidex-arm64.zip
            release/droidex-x64.dmg
            release/droidex-x64.zip
            release/appcast-arm64.xml
            release/appcast-x64.xml
            release/*.delta
            release/SHA256SUMS
          )
          test "$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$RELEASE_REPOSITORY/immutable-releases" \
            --jq '.enabled')" = "true"
          gh release verify-asset --help >/dev/null
          if gh release view "$GITHUB_REF_NAME" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists in $RELEASE_REPOSITORY" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --repo "$RELEASE_REPOSITORY" \
            --target main \
            --title "DROIDEX $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          touch "$RUNNER_TEMP/droidex-draft-created"
          gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --repo "$RELEASE_REPOSITORY"

          for asset in "${ASSETS[@]}"; do
            NAME="${asset##*/}"
            LOCAL_DIGEST="$(shasum -a 256 "$asset" | awk '{print $1}')"
            REMOTE_DIGEST="$(gh release view "$GITHUB_REF_NAME" \
              --repo "$RELEASE_REPOSITORY" \
              --json assets \
              --jq '.assets[] | select(.name == "'"$NAME"'") | .digest')"
            test "sha256:$LOCAL_DIGEST" = "$REMOTE_DIGEST"
          done

          gh release edit "$GITHUB_REF_NAME" --repo "$RELEASE_REPOSITORY" --draft=false
          for attempt in {1..13}; do
            if gh release verify "$GITHUB_REF_NAME" --repo "$RELEASE_REPOSITORY"; then
              break
            fi
            if test "$attempt" -eq 13; then
              echo "Release attestation was not available after 60 seconds" >&2
              exit 1
            fi
            sleep 5
          done
          for asset in "${ASSETS[@]}"; do
            gh release verify-asset "$GITHUB_REF_NAME" "$asset" --repo "$RELEASE_REPOSITORY"
          done

      - name: Remove an incomplete workflow-owned draft
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.DROIDEX_RELEASE_TOKEN }}
        run: |
          if test -f "$RUNNER_TEMP/droidex-draft-created" && \
            test "$(gh release view "$GITHUB_REF_NAME" \
              --repo "$RELEASE_REPOSITORY" \
              --json isDraft --jq '.isDraft')" = "true"; then
            gh release delete "$GITHUB_REF_NAME" \
              --repo "$RELEASE_REPOSITORY" \
              --cleanup-tag \
              --yes
          fi

      - name: Remove release signing certificate and keychain
        if: always()
        timeout-minutes: 2
        run: |
          # Removing the admin trust setting waits for a password dialog no one can
          # answer, so it hung the job and lost its logs. The runner is discarded
          # after the job, and deleting the keychain removes the signing identity.
          if test -f "$RUNNER_TEMP/droidex-signing.keychain-db"; then
            security delete-keychain "$RUNNER_TEMP/droidex-signing.keychain-db" ||
              echo "::warning::Could not delete the runner's temporary signing keychain."
          fi
          rm -f "$RUNNER_TEMP/droidex-signing.p12" "$RUNNER_TEMP/droidex-signing.pem"
